<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NEA Bharatpur">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nea_bht">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>nea_bht</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script>
    // Suppress all console logs
    console.log = () => { };
    console.warn = () => { };
    console.error = () => { };
    console.info = () => { };
    console.debug = () => { };

    const serviceWorkerVersion = '"3631625921"';
    var scriptLoaded = false;

    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        const serviceWorkerUrl = `flutter_service_worker.js?v=${serviceWorkerVersion}`;

        navigator.serviceWorker.register(serviceWorkerUrl)
          .then((reg) => {
            function waitForActivation(serviceWorker) {
              if (!serviceWorker) {
                return;
              }

              serviceWorker.addEventListener('statechange', () => {
                if (serviceWorker.state === 'activated') {
                  loadMainDartJs();
                }
              });
            }

            if (!reg.active || !reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
              reg.update().then(() => {
                if (reg.installing) {
                  waitForActivation(reg.installing);
                } else {
                  loadMainDartJs();
                }
              });
            } else {
              loadMainDartJs();
            }
          })
          .catch(() => {
            loadMainDartJs();
          });

        setTimeout(() => {
          if (!scriptLoaded) {
            loadMainDartJs();
          }
        }, 10000); // Increased timeout to 10 seconds
      });
    } else {
      loadMainDartJs();
    }
  </script>
</body>

</html>
